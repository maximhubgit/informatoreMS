name: informatoreMS
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase (remota + cache)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Cache locale semplice (offline)
  shared_preferences: ^2.5.3

  # UI / Calendario
  table_calendar: ^3.2.0
  flutter_slidable: ^4.0.0
  intl: ^0.20.0

  # Utilità
  uuid: ^4.5.0
  equatable: ^2.0.0
  connectivity_plus: ^6.0.0

  # Excel export
  excel: ^2.1.0
  path_provider: ^2.1.0
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
